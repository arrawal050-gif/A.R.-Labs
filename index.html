  <body class="bg-[#050505] text-[#f4f4f0] selection:bg-zinc-800 selection:text-white min-h-screen antialiased overflow-x-hidden">
    <!-- SVG Liquid Displacement Filter -->
    <svg class="sr-only" style="display: none;" aria-hidden="true">
      <defs>
        <filter id="liquid-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence
            id="liquid-turbulence"
            type="fractalNoise"
            baseFrequency="0.015 0.015"
            numOctaves="2"
            result="noise"
          />
          <feDisplacementMap
            id="liquid-displacement"
            in="SourceGraphic"
            in2="noise"
            scale="0"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
